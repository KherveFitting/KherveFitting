[workspace]
name = "KherveFitting"
version = "0.1.0"
description = "Kherve Fitting project"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.10,<3.15"
annotated-types = ">=0.7.0,<0.8"
anyio = ">=4.12.1,<5"
asteval = ">=1.0.8,<2"
beautifulsoup4 = ">=4.14.3,<5"
darkdetect = ">=0.8.0,<0.9"
defusedxml = ">=0.7.1,<0.8"
fastparquet = ">=2025.12.0,<2026"
flexcache = ">=0.3,<0.4"
flexparser = ">=0.4,<0.5"
h5netcdf = ">=1.8.1,<2"
h5py = ">=3.15.1,<4"
httpcore = ">=1.0.9,<2"
httpx = ">=0.28.1,<0.29"
hyperspy = ">=2.4.0,<3"
lmfit = ">=1.3.4,<2"
matplotlib = ">=3.10.8,<4"
numpy = ">=2.3.5,<3"
odfpy = ">=1.4.1,<2"
olefile = ">=0.47,<0.48"
openai = ">=2.21.0,<3"
openpyxl = ">=3.1.5,<4"
pandas = ">=3.0.0,<4"
pillow = ">=12.1.1,<13"
pint = ">=0.25.2,<0.26"
psutil = ">=7.2.2,<8"
pyarrow = ">=23.0.0,<24"
pydantic = ">=2.12.5,<3"
pydantic-core = ">=2.41.5,<3"
pyperclip = ">=1.11.0,<2"
python-pptx = ">=1.0.2,<2"
requests = ">=2.32.5,<3"
scikit-learn = ">=1.8.0,<2"
scipy = ">=1.17.0,<2"
striprtf = ">=0.0.29,<0.0.30"
tzlocal = ">=5.3.1,<6"
uncertainties = ">=3.2.4,<4"
wxpython = ">=4.2.4,<5"
xarray = ">=2026.2.0,<2027"
xlrd = ">=2.0.2,<3"
xlsxwriter = ">=3.2.9,<4"

# workaround for pygame on python 3.14
sdl = "*"

[pypi-dependencies]
customtkinter = ">=5.2.2, <6"
dgbowl-schemas = ">=124, <125"
et-xmlfile = ">=2.0.0,<3"
lmfitxps = ">=4.2.0, <5"
pygame = ">=2.6.1,<3" # holds back python 3.14
spe2py = ">=2.0.0, <3"
untangle = ">=1.2.1, <2"
vamas = ">=0.2.0, <0.3"
yadg = ">=6.2.2, <7"

[tasks]
app = "python KherveFitting.py"
